<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        flex-direction: column;
    }

    .dataInputDiv{
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap : 10px;
    }

    .input{
        width: 200px;
        height: 20px;
        border : 1px solid gray;
        padding: 5px;
        border-radius: 5px;
    }

    #container{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: calc(100vh - 60px);
    }

    .navbar{
        background-color: blue;
        width: 100%;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        color: white;
        position: sticky;
    }

    .button{
        width: 100px;
        height: 35px;
        color: white;
        background-color: orange;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
    }

    .button:hover {
        opacity: 0.9;
    }

    .dialog {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 350px;
        height: 400px;
        padding: 25px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 5px;
        justify-content: flex-start;   
    }

    .dialog input {
        height: 35px;
        padding: 5px;
        border-radius: 5px;
        border: 1px solid gray;
    }

    .dialog button {
        height: 35px;
        background-color: orange;
        border: none;
        border-radius: 5px;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-family: Arial, sans-serif;
    }

    .table th {
        background-color: #f4f4f4;
        padding: 10px;
        text-align: center;
        border-bottom: 2px solid #ddd;
    }

    .table td {
        padding: 20px;
        border-bottom: 1px solid #ddd;
    }

    .table tr:hover {
        background-color: #f9f9f9;
    }

    .table button {
        padding: 5px 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .table .edit-btn {
        background-color: #4CAF50;
        color: white;
        margin: 10px;
    }

    .table .delete-btn {
        background-color: #f44336;
        color: white;
        margin: 10px;
    }
</style>
<body>
    <nav id="navbar" class="navbar">
        <h2 id="welcome"></h2>
    </nav>
    <div id="container">

    </div>
</body>
<script src="index.js"></script>
</html>
